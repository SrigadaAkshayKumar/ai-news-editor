# MINDTAIL Shorts (branch mindtail). Manual runs only; nothing is uploaded to YouTube.
#   task=scripts  Claude writes a batch of Hindi Shorts scripts (mindtail-script skill) and puts each one in Google
#                 Drive: MINDTAIL/inbox/shorts/MT-XXXX-slug/ (MT-XXXX_voiceover.txt is what you paste into ElevenLabs).
#   task=edit     for each Short whose folder now has your voiceover audio: Claude edits a 9:16 Short (mindtail-edit
#                 skill), verifies it, and puts it in Drive: MINDTAIL/output/MT-XXXX-slug/.
#   task=status   lists every Short and what it is waiting for.
# Run from: Actions → MINDTAIL → Run workflow → "Use workflow from: mindtail".
# Same secrets as the news workflow (RCLONE_CONF, CLAUDE_CODE_OAUTH_TOKEN, PEXELS/PIXABAY/ELEVENLABS keys), but its
# own Drive folder (vars.MINDTAIL_DRIVE_ROOT, default MINDTAIL). Media and transcripts go to Drive, never git: the repo is public.
name: MINDTAIL

on:
  workflow_dispatch:
    inputs:
      task:
        description: "scripts = write new scripts · edit = edit Shorts that have audio · status = list Shorts"
        type: choice
        options: [scripts, edit, status]
        default: status
      count:
        description: "How many scripts to write, or the most Shorts to edit in this run (empty = config/mindtail.json)"
        required: false
      short:
        description: "edit only: one Short, e.g. MT-0003 (empty = the next ones with audio)"
        required: false
      note:
        description: "Note for Claude, e.g. topics for the scripts or style words for the edit"
        required: false
      variants:
        description: "edit only: also render the other looks (config/mindtail.json → looks) to compare templates"
        type: boolean
        default: false
      speed:
        description: "edit only: speed of the fast copy (empty = config/mindtail.json, 1.15; none = no fast copy)"
        required: false

concurrency:
  group: mindtail
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mindtail:
    # never on main: this workflow belongs to the MINDTAIL branch
    if: github.ref_name == 'mindtail'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DRIVE: gdrive:${{ vars.MINDTAIL_DRIVE_ROOT || 'MINDTAIL' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'medium' }}
      REMOTION_CONCURRENCY: "2"
      RENDER_MIN_FREE_GB: "1.5"
      HYPERFRAMES_WORKERS: "1"
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4

      - name: rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Google Drive login
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          test -n "$RCLONE_CONF" || { echo "::error::secret RCLONE_CONF is missing (docs/cloud-setup.md)"; exit 1; }
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          f=~/.config/rclone/rclone.conf
          sed -i 's/\r$//' "$f"
          if ! grep -q '^\[gdrive\]' "$f"; then
            n=$(grep -c '^\[' "$f" || true)
            if [ "$n" = 1 ]; then sed -i 's/^\[.*\]\s*$/[gdrive]/' "$f";
            elif [ "$n" -gt 1 ]; then echo "::error::RCLONE_CONF has $n remotes and none is [gdrive]"; exit 1; fi
            grep -q '^\[gdrive\]' "$f" || sed -i '1i [gdrive]' "$f"
          fi
          rclone lsd gdrive: --max-depth 1 >/dev/null || { echo "::error::rclone cannot reach Google Drive with RCLONE_CONF"; exit 1; }

      - name: Pull the MINDTAIL inbox from Drive
        run: |
          rclone mkdir "$DRIVE/inbox/shorts" && rclone mkdir "$DRIVE/output"
          rclone copy "$DRIVE/inbox" inbox --exclude "README.md" -v

      - name: Status
        run: |
          node tools/mindtail.mjs status | tee status.txt
          { echo '### MINDTAIL Shorts'; echo '```'; cat status.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan
        id: plan
        if: inputs.task != 'status'
        env:
          COUNT: ${{ inputs.count }}
          SHORT: ${{ inputs.short }}
        run: |
          if [ "$TASK" = scripts ]; then
            node tools/mindtail.mjs next-ids $COUNT
          else
            node tools/mindtail.mjs ready $SHORT ${COUNT:+--max "$COUNT"}
          fi

      - name: Nothing to edit
        if: inputs.task == 'edit' && steps.plan.outputs.count == '0'
        run: echo "No Short has voiceover audio waiting. Upload the audio into its Drive folder (MINDTAIL/inbox/shorts/MT-XXXX-…/) and run again." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: inputs.task == 'scripts' || steps.plan.outputs.count != '0'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            remotion/package-lock.json
            hyperframes/package-lock.json

      - uses: actions/setup-python@v5
        if: inputs.task == 'edit' && steps.plan.outputs.count != '0'
        with:
          python-version: "3.11"

      - name: Install Claude Code
        if: inputs.task == 'scripts' || steps.plan.outputs.count != '0'
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "Claude Code $(claude --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- scripts
      - name: Write the scripts
        if: inputs.task == 'scripts'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDS: ${{ steps.plan.outputs.ids }}
          NOTE: ${{ inputs.note }}
        run: |
          claude -p "This is the unattended MINDTAIL script step: use the mindtail-script skill.
          Write one Short for each of these IDs: $IDS
          Today: $(TZ=Asia/Kolkata date '+%A %d %B %Y, %H:%M IST')
          Note from the owner (wins over the skill's defaults where they clash): ${NOTE:-none}" \
            ${CLAUDE_MODEL:+--model "$CLAUDE_MODEL"} --effort "$CLAUDE_EFFORT" --dangerously-skip-permissions --output-format stream-json --verbose > claude-script-log.jsonl
          node tools/mindtail.mjs script-check

      - name: Save the scripts to Drive
        if: inputs.task == 'scripts' && always()
        run: |
          [ -f mindtail-script.json ] || exit 0
          for f in $(node -e 'console.log((require("./mindtail-script.json").shorts||[]).join(" "))'); do
            [ -d "inbox/shorts/$f" ] || continue
            id=${f:0:7}
            cat > "inbox/shorts/$f/HOW_TO.txt" <<EOF
          $f

          1. Open ${id}_voiceover.txt, copy ALL of it, paste it into ElevenLabs and generate the Hindi voice.
          2. Download the audio and upload it into THIS folder (mp3 or wav, any name, only one audio file).
          3. Run GitHub Actions -> MINDTAIL -> Run workflow -> branch mindtail -> task edit.
             The finished Short appears in MINDTAIL/output/$f/

          ${id}_script.md has the scenes, the stock footage plan, the sources and title ideas.
          Optional: add brief.txt here with style words for this Short only.
          EOF
            sed -i 's/^          //' "inbox/shorts/$f/HOW_TO.txt"
            rclone copy "inbox/shorts/$f" "$DRIVE/inbox/shorts/$f" -v
          done
          if [ -f mindtail-script-report.md ]; then rclone copyto mindtail-script-report.md "$DRIVE/output/_script-reports/$(TZ=Asia/Kolkata date +%Y-%m-%d-%H%M).md" -v; fi
          { echo '### New scripts in Drive (MINDTAIL/inbox/shorts/)'; node -e 'for (const s of require("./mindtail-script.json").shorts||[]) console.log("- " + s)'; echo; echo 'Next: paste each MT-XXXX_voiceover.txt into ElevenLabs, upload the audio into the same folder, then run task=edit.'; } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------- edit
      - name: Install edit dependencies
        if: inputs.task == 'edit' && steps.plan.outputs.count != '0'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji sox
          npm ci
          (cd remotion && npm ci)
          (cd hyperframes && npm ci)
          pip install -q opencv-python-headless numpy
          # free Hindi word timings: MMS forced alignment (tools/align/align.py); CPU wheels only
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q uroman soundfile

      - name: Cache the alignment model
        if: inputs.task == 'edit' && steps.plan.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: mms-fa-torchaudio-2.8

      - name: Write .env
        if: inputs.task == 'edit' && steps.plan.outputs.count != '0'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENVERSE_TOKEN: ${{ secrets.OPENVERSE_TOKEN }}
        run: |
          for k in ELEVENLABS_API_KEY PEXELS_API_KEY PIXABAY_API_KEY OPENVERSE_TOKEN; do
            echo "$k=${!k}" >> .env
            echo "- $k: $([ -n "${!k}" ] && echo set || echo missing)" >> "$GITHUB_STEP_SUMMARY"
          done
          # word timings come from the free aligner (no ElevenLabs needed); footage needs Pexels or Pixabay
          [ -n "$PEXELS_API_KEY$PIXABAY_API_KEY" ] || { echo "::error::secrets PEXELS_API_KEY and PIXABAY_API_KEY are both missing: no stock footage"; exit 1; }

      - name: Edit, check and deliver each Short
        if: inputs.task == 'edit' && steps.plan.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHORTS: ${{ steps.plan.outputs.shorts }}
          NOTE: ${{ inputs.note }}
          VARIANTS: ${{ inputs.variants }}
          SPEED: ${{ inputs.speed }}
        run: |
          failed=0
          git config user.name "mindtail bot"
          git config user.email "actions@users.noreply.github.com"
          for f in $SHORTS; do
            echo "::group::$f"
            rm -f mindtail-run.json mindtail-report.md
            node tools/mindtail.mjs info "$f" > info.json
            get() { node -e "console.log(require('./info.json')['$1'])"; }
            stamp=$(date -u +%Y%m%d-%H%M)
            claude -p "This is the unattended MINDTAIL edit: use the mindtail-edit skill.
          Short: $f
          Voiceover audio: $(get audio)
          Voiceover text (source of truth): $(get voiceover)
          Script with scenes and Screen directions: $(get script)
          Brief: $(get brief | sed 's/^$/none, use config\/mindtail.json/')
          Note from the owner: ${NOTE:-none}" \
              ${CLAUDE_MODEL:+--model "$CLAUDE_MODEL"} --effort "$CLAUDE_EFFORT" --dangerously-skip-permissions --output-format stream-json --verbose > "claude-edit-$f.jsonl" || true
            rclone copy "claude-edit-$f.jsonl" "$DRIVE/output/_logs/$f-$stamp" || true
            if node tools/mindtail.mjs check "$f" > check.json; then
              p=$(node -e 'console.log(require("./mindtail-run.json").project)')
              rclone copy "projects/$p/output" "$DRIVE/output/$f" -v
              node tools/mindtail.mjs done "$f"
              git add "projects/$p" config/mindtail-state.json
              git commit -q -m "mindtail: $f"
              echo "- **$f** → Drive MINDTAIL/output/$f" >> "$GITHUB_STEP_SUMMARY"
              # a faster copy: picture and voice together (captions/cuts/SFX stay in sync), pitch kept by atempo
              SPEED=${SPEED:-$(node -e 'console.log(require("./config/mindtail.json").speed||"")')}
              if [ -n "$SPEED" ] && [ "$SPEED" != "1" ] && [ "$SPEED" != "none" ]; then
                if node tools/speed.mjs "projects/$p/output/final-9x16.mp4" "$SPEED"; then
                  rclone copy "projects/$p/output" "$DRIVE/output/$f" --include "final-9x16-fast-*.mp4" -v
                  echo "  - fast copy (${SPEED}x) → Drive MINDTAIL/output/$f" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::$f: the fast copy failed; the main Short is in Drive"
                fi
              fi
              # the main Short is in Drive already; the other looks follow (a failure here never fails the Short)
              if [ "$VARIANTS" = "true" ]; then
                looks=$(node -e 'const l=require("./config/mindtail.json").looks||[];console.log(l.slice(1).map(x=>[x.label,x.style,x.captions,x.accent].join(":")).join(","))')
                a=$(node -e 'console.log((require("./config/mindtail.json").looks||[])[0]?.label||"A")')
                if node tools/variants.mjs "$p" --format 9:16 --a-label "$a" --looks "$looks"; then
                  rclone copy "projects/$p/output/variants" "$DRIVE/output/$f/variants" --exclude ".main-*" -v
                  echo "  - variants → Drive MINDTAIL/output/$f/variants" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::$f: the look variants failed; the main Short is in Drive"
                  echo "  - variants failed (main Short is fine)" >> "$GITHUB_STEP_SUMMARY"
                fi
                git checkout -q -- "projects/$p" 2>/dev/null || true
              fi
            else
              failed=1
              cat check.json || true
              for r in mindtail-run.json mindtail-report.md; do [ -f "$r" ] && rclone copy "$r" "$DRIVE/output/_failed/$f-$stamp"; done
              echo "- **$f** failed: report in Drive MINDTAIL/output/_failed/$f-$stamp" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          # the edit leaves other tracked files modified: keep them out of the rebase
          git pull --rebase --autostash -q origin mindtail && git push origin HEAD:mindtail
          exit $failed

      - name: Keep the script log (Drive)
        if: always() && inputs.task == 'scripts'
        run: |
          dir="$DRIVE/output/_logs/scripts-$(date -u +%Y%m%d-%H%M)"
          for f in claude-script-log.jsonl mindtail-script.json mindtail-script-report.md; do [ -f "$f" ] && rclone copy "$f" "$dir"; done
